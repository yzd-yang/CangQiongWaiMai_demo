server:
  port: 8083
spring:
  application:
    name: sky-trade
  profiles:
    active: local
  cloud:
    sentinel:
      transport:
        dashboard: ${sky.cloud.sentinel.transport.dashboard} # 配置Sentinel控制台地址
      http-method-specify: true # 开启请求方式前缀
    nacos:
      discovery:
        server-addr: 192.168.6.128:8848   # 你的 Nacos
      config:
        import-check:
          enabled: false # 禁用导入检查
  datasource:
    druid:
      driver-class-name:
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  data:
    redis:
      host: ${sky.redis.host}
      port: ${sky.redis.port}
      password: ${sky.redis.password}
      database: ${sky.redis.database}

## Seata
seata:
  registry:
    type: file
  config:
    type: file
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: 192.168.6.128:8091
feign:
  sentinel:
    enabled: true # 开启feign对sentinel的支持
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.sky.controller

knife4j:
  enable: true
  setting:
    language: zh_cn