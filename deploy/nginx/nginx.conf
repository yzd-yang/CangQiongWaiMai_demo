# 前端 / 管理端静态资源 + 全部 API 反代到 sky-gateway:8080
# 小程序 request 合法域名、管理端 vue.config 代理，都只指向本 Nginx（或直接指向网关 8080）

upstream sky_gateway {
    server sky-gateway:8080;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 20m;

    # 若把管理端 dist 挂到 /usr/share/nginx/html，取消下面注释
    # root /usr/share/nginx/html;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    # 无静态资源时，把根路径也转到网关（Knife4j / 健康检查）
    location / {
        proxy_pass http://sky_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header token $http_token;
        proxy_set_header authentication $http_authentication;
    }

    location /admin/ {
        proxy_pass http://sky_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header token $http_token;
    }

    location /user/ {
        proxy_pass http://sky_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header authentication $http_authentication;
    }

    location /pay/ {
        proxy_pass http://sky_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header authentication $http_authentication;
    }

    # 管理端来单提醒 WebSocket，必须走网关
    location /ws/ {
        proxy_pass http://sky_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
