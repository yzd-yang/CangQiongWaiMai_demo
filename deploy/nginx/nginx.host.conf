# 宿主机已跑 sky-gateway:8080 时使用：docker compose --profile nginx up -d nginx
# 业务服务也容器化时请用 nginx.conf（compose apps profile 已挂载）

upstream sky_gateway {
    server host.docker.internal:8080;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 20m;

    location / {
        proxy_pass http://sky_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header token $http_token;
        proxy_set_header authentication $http_authentication;
    }

    location /ws/ {
        proxy_pass http://sky_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
