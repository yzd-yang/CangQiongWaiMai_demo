# 苍穹外卖基础设施 +（可选）业务服务
# 用法见仓库根 README、doc/升级/阶段6.md
#
#   cd deploy
#   docker compose up -d                          # 只起 MySQL / Redis / Nacos / Sentinel / Seata
#   docker compose --profile nginx up -d          # 再加 Nginx，反代宿主机网关 8080
#   docker compose --profile apps up -d --build   # 再加全部微服务 + Nginx（需先 mvn package）

name: sky

x-app-env: &app-env
  TZ: Asia/Shanghai
  NACOS_ADDR: nacos:8848
  SKY_DATASOURCE_HOST: mysql
  SKY_DATASOURCE_PORT: "3306"
  SKY_DATASOURCE_USERNAME: root
  SKY_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
  SKY_REDIS_HOST: redis
  SKY_REDIS_PORT: "6379"
  SKY_REDIS_PASSWORD: ""
  SKY_REDIS_DATABASE: "0"
  SKY_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
  SEATA_ADDR: seata:8091

x-app-common: &app-common
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  mysql:
    image: mysql:8.0
    container_name: sky-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ../doc/升级/sql/sky_user.sql:/docker-entrypoint-initdb.d/01-sky_user.sql:ro
      - ../doc/升级/sql/sky_product.sql:/docker-entrypoint-initdb.d/02-sky_product.sql:ro
      - ../doc/升级/sql/sky_trade.sql:/docker-entrypoint-initdb.d/03-sky_trade.sql:ro
      - ../doc/升级/sql/sky_pay.sql:/docker-entrypoint-initdb.d/04-sky_pay.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.2
    container_name: sky-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: sky-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: sky-sentinel
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      # 宿主机 8090 对齐各服务 application-local.yaml 中 dashboard: localhost:8090
      - "8090:8858"

  seata:
    image: seataio/seata-server:1.5.2
    container_name: sky-seata
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      STORE_MODE: file
      SEATA_PORT: 8091
      # 业务在宿主机跑时填局域网 IP；容器内跑业务时改为 seata（见 .env.example）
      SEATA_IP: ${SEATA_IP:-192.168.6.128}
    ports:
      - "8091:8091"

  nginx:
    image: nginx:1.27-alpine
    container_name: sky-nginx
    restart: unless-stopped
    profiles: ["nginx"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.host.conf:/etc/nginx/conf.d/default.conf:ro

  sky-user:
    <<: *app-common
    profiles: ["apps"]
    build:
      context: ../sky-user
      dockerfile: Dockerfile
    container_name: sky-user
    environment:
      <<: *app-env
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  sky-product:
    <<: *app-common
    profiles: ["apps"]
    build:
      context: ../sky-product
      dockerfile: Dockerfile
    container_name: sky-product
    environment:
      <<: *app-env
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  sky-trade:
    <<: *app-common
    profiles: ["apps"]
    build:
      context: ../sky-trade
      dockerfile: Dockerfile
    container_name: sky-trade
    environment:
      <<: *app-env
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_started

  sky-report:
    <<: *app-common
    profiles: ["apps"]
    build:
      context: ../sky-report
      dockerfile: Dockerfile
    container_name: sky-report
    environment:
      <<: *app-env
    ports:
      - "8084:8084"
    depends_on:
      nacos:
        condition: service_healthy

  sky-pay:
    <<: *app-common
    profiles: ["apps"]
    build:
      context: ../sky-pay
      dockerfile: Dockerfile
    container_name: sky-pay
    environment:
      <<: *app-env
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_started

  sky-file:
    <<: *app-common
    profiles: ["apps"]
    build:
      context: ../sky-file
      dockerfile: Dockerfile
    container_name: sky-file
    environment:
      <<: *app-env
    ports:
      - "8086:8086"
    depends_on:
      nacos:
        condition: service_healthy

  sky-gateway:
    <<: *app-common
    profiles: ["apps"]
    build:
      context: ../sky-gateway
      dockerfile: Dockerfile
    container_name: sky-gateway
    environment:
      <<: *app-env
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      sky-user:
        condition: service_started
      sky-product:
        condition: service_started
      sky-trade:
        condition: service_started

  nginx-apps:
    image: nginx:1.27-alpine
    container_name: sky-nginx-apps
    restart: unless-stopped
    profiles: ["apps"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sky-gateway:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
